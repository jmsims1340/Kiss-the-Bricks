let muted=false,audioOn=false; function initAudio(){if(audioOn)return;audioOn=true;theme.play().catch(()=>{})}
function reset(){state='ready';cd=0;raceTime=0;player={s:START,v:0,a:0,steer:0,lap:0,lt:0,best:+localStorage.best||0,done:false};ais=[{s:START-120,v:0,a:0,lap:0,lt:0,best:0,done:false},{s:START-300,v:0,a:0,lap:0,lt:0,best:0,done:false},{s:START-500,v:0,a:0,lap:0,lt:0,best:0,done:false}];}

const mx=w-64,my=24; ctx.globalAlpha=0.5;ctx.fillStyle=muted?'#d0312d':'#666'; ctx.beginPath();ctx.arc(mx,my,26,0,7);ctx.fill(); ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif'; ctx.fillText(muted?'X':'M',mx-8,my+9); } }
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(state==='count'){cd-=dt;if(cd<=0){state='race';raceTime=0;player.lt=0}}if(state==='race')raceTime+=dt;updPlayer(dt);for(const a of ais)updAI(a,dt);updAudio();draw();requestAnimationFrame(loop)} reset();requestAnimationFrame(loop);

if(s<2*S+Math.PI*R){const t=Math.PI/2-(s-2*S)/R;
return{x:S+R*Math.cos(t),y:R*Math.sin(t),tx:Math.sin(t),ty:-Math.cos(t)}}
if(s<4*S+Math.PI*R){const u=s-2*S-Math.PI*R;
return{x:S-u,y:-R,tx:-1,ty:0}}
const t=-Math.PI/2-(s-4*S-Math.PI*R)/R;
return{x:-S+R*Math.cos(t),y:R*Math.sin(t),tx:Math.sin(t),ty:-Math.cos(t)}
}
function proj(x,y){
if(x>=-S&&x<=S){
if(y>=0)return{s:x+S,d:y-R};
return{s:2*S+Math.PI*R+(S-x),d:-y-R}
}
if(x>S){const t=Math.atan2(y,x-S);
return{s:((2*S+(Math.PI/2-t)*R)%P+P)%P,d:Math.hypot(x-S,y)-R}}
const t=Math.atan2(y,x+S);
return{s:((4*S+Math.PI*R+(t+Math.PI/2)*R)%P+P)%P,d:Math.hypot(x+S,y)-R}
}
function capsule(r){const p=new Path2D();
p.moveTo(-S,-r);p.lineTo(S,-r);p.arc(S,0,r,-Math.PI/2,Math.PI/2);
p.lineTo(-S,r);p.arc(-S,0,r,Math.PI/2,Math.PI*1.5);p.closePath();return p}
const outerP=capsule(R+W),innerP=capsule(R-W);

const touch={left:false,right:false,gas:false,brake:false};
function bs(){return Math.min(150,cv.width*0.22,(cv.width-80)/4)}
function zone(x,y){
const b=bs(),h=cv.height;
if(y>h-b-40){
if(x<20+b)return'left';
if(x<20+2*b+14)return'right';
if(x>cv.width-20-b)return'brake';
if(x>cv.width-20-2*b-14)return'gas';
}

}
function readTouches(e){
touch.left=touch.right=touch.gas=touch.brake=false;
for(const t of e.touches){const z=zone(t.clientX,t.clientY);if(z)touch[z]=true}
}
function tapAction(){
if(state==='ready'){state='count';cd=3.2}
else if(state==='done'){reset()}
}
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();readTouches(e);tapAction()},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();readTouches(e)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();readTouches(e)},{passive:false});
cv.addEventListener('touchcancel',e=>{e.preventDefault();readTouches(e)},{passive:false});
function place(c,s0,lat){
c.s=s0;c.lat=lat;c.tlat=lat;c.v=0;c.lap=0;c.sp=((s0-START)%P+P)%P;c.prevSp=c.sp;

c.x=n.x+nx*lat;c.y=n.y+ny*lat;c.a=Math.atan2(n.ty,n.tx);c.best=0;c.lt=0
}
function reset(){
state='ready';raceTime=0;
player={col:'#f2b632',isP:true};
ais=[{col:'#d0312d',vt:478},{col:'#1f6fd6',vt:490},{col:'#e8e8e8',vt:502}];
let g=START-60,lat=-18;
for(const a of ais){place(a,g,lat);g-=45;lat=-lat}

}

function updPlayer(dt){
const p=player;
const L=keys.arrowleft||keys.a||touch.left,
Rt=keys.arrowright||keys.d||touch.right,
U=keys.arrowup||keys.w||touch.gas,
D=keys.arrowdown||keys.s||touch.brake;

if(U)p.v+=ACC*dt;
if(D)p.v-=BRK*dt;
}

p.x=n.x+nx*cl;p.y=n.y+ny*cl;p.v*=0.6
}

const dx=p.x-a.x,dy=p.y-a.y,dd=Math.hypot(dx,dy);

}

if(p.prevSp>P*0.9&&p.sp<P*0.1){

p.lt=raceTime;p.lap++;

} else if(p.prevSp<P*0.1&&p.sp>P*0.9&&p.lap>0){p.lap--}
}
}
function updAI(c,dt){
if(state!=='race')return;
const slow=(c.s>2*S&&c.s<2*S+Math.PI*R)||(c.s>4*S+Math.PI*R);
const vt=c.vt*(slow?0.90:1);
c.v+=(vt-c.v)*Math.min(1,dt*0.8);
c.s=((c.s+c.v*dt)%P+P)%P;
if(Math.random()<dt*0.3)c.tlat=-c.tlat;
c.lat+=(c.tlat-c.lat)*Math.min(1,dt*0.5);
const n=posAt(c.s),nx=-n.ty,ny=n.tx;
c.x=n.x+nx*c.lat;c.y=n.y+ny*c.lat;c.a=Math.atan2(n.ty,n.tx);
c.prevSp=c.sp;c.sp=((c.s-START)%P+P)%P;
if(c.prevSp>P*0.9&&c.sp<P*0.1)c.lap++;
}
function fmt(t){if(!t)return'--:--.--';
const m=Math.floor(t/60),s=t-m*60;
return m+':'+(s<10?'0':'')+s.toFixed(2)}
function drawCar(c){
ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
ctx.fillStyle='#111';
ctx.fillRect(-14,-12,9,5);ctx.fillRect(-14,7,9,5);
ctx.fillRect(9,-12,9,5);ctx.fillRect(9,7,9,5);
ctx.fillStyle=c.col;

ctx.fillRect(16,-11,4,22);ctx.fillRect(-22,-10,4,20);

}

ctx.font='bold 42px sans-serif';

ctx.font='bold 30px sans-serif';

}

ctx.fillStyle='#0a5c0a';ctx.fill(innerP);

ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}

ctx.fillStyle=((i/14+row)%2===0)?'#fff':'#111';

const p=player,w=cv.width;

ctx.textAlign='right';
ctx.fillText('LAP '+fmt(state==='race'?raceTime-p.lt:0),w-20,40);
ctx.fillText('BEST '+fmt(p.best),w-20,74);

ctx.textAlign='center';

}

ctx.font='bold 26px sans-serif';

}

ctx.font='bold 90px sans-serif';

}

ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,cv.width,cv.height);

}
let ac=null,osc=null,gain=null,muted=false;
function initAudio(){theme.play();if(ac)return;

osc=ac.createOscillator();osc.type='sawtooth';
gain=ac.createGain();gain.gain.value=0.03;
osc.connect(gain);gain.connect(ac.destination);osc.start()}
function updAudio(){if(!ac)return;
osc.frequency.value=55+player.v*0.5;
gain.gain.value=muted?0:0.015+player.v/VMAX*0.03}
theme.muted=muted
addEventListener('keydown',e=>{
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();

const k=e.key.toLowerCase();
if(k==='m'){muted=!muted;return}
if(k==='r'){reset();return}

});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.key]=false});
let last=0;
function loop(t){
const dt=Math.min((t-last)/1000,0.05);last=t;
if(state==='count'){cd-=dt;if(cd<=0)state='race'}
if(state==='race')raceTime+=dt;

for(const a of ais)updAI(a,dt);

}
